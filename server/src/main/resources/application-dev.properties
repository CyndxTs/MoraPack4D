# === DESARROLLO: MySQL en localhost ===
# La BD se crea sola si no existe (createDatabaseIfNotExist). Credenciales en server/.env (variables LOCAL_*)
spring.datasource.url=jdbc:mysql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:morapack4d}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${LOCAL_DB_USER:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:}