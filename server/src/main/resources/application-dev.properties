# === DESARROLLO: MySQL en localhost ===
# La BD se crea sola si no existe (createDatabaseIfNotExist). Credenciales en server/.env
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:morapack4d}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
