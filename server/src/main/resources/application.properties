spring.application.name=morapack

# Variables locales (contraseñas, host, etc.) desde server/.env  (NO se sube al repositorio)
spring.config.import=optional:file:.env[.properties]

# Perfil activo: dev (localhost) por defecto | tidb (TiDB Cloud)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Render asigna el puerto en la variable PORT
server.port=${PORT:${SERVER_PORT:8080}}

# Datasource (los valores concretos vienen del perfil + .env)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (el esquema lo maneja el seed, Hibernate no toca la BD)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Subida de archivos sin límite
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-swallow-size=-1

# Purga de datos de operación que ya no se usan (registros dados de baja, lotes/segmentaciones reemplazados,
# rutas y vuelos sin uso, eventos vencidos). Cron de Spring en UTC. Se activa/desactiva en PARAMETROS (purga_automatica).
# También a mano: POST /api/operation-purge
morapack.purga.cron=${PURGA_CRON:0 17 * * * *}

# Orígenes permitidos para el front (CORS), separados por comas. En Render: la URL del static site.
morapack.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# Spring Security sin usuario por defecto (la autenticación es propia: JWT + SESION)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Autenticación
#  - JWT_SECRET: clave para firmar los tokens de acceso (10 min). Si falta se genera una al arrancar.
#  - GOOGLE_CLIENT_ID: el mismo Client ID que usa el front (VITE_GOOGLE_CLIENT_ID).
#  - BREVO_API_KEY / MAIL_REMITENTE / MAIL_REMITENTE_NOMBRE: correos con el código de 6 dígitos (API HTTP de Brevo).
#    Sin BREVO_API_KEY el código se imprime en la consola (desarrollo).
morapack.jwt.secreto=${JWT_SECRET:}
morapack.google.client-id=${GOOGLE_CLIENT_ID:}
morapack.brevo.api-key=${BREVO_API_KEY:}
morapack.correo.remitente=${MAIL_REMITENTE:}
morapack.correo.remitente-nombre=${MAIL_REMITENTE_NOMBRE:MoraPack4D}
