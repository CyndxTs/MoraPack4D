spring.application.name=morapack

# Variables locales (contraseñas, host, etc.) desde server/.env  (NO se sube al repositorio)
spring.config.import=optional:file:.env[.properties]

# Perfil activo: dev (localhost) por defecto | tidb (TiDB Cloud)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# Datasource (los valores concretos vienen del perfil + .env)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (el esquema lo maneja el seed, Hibernate no toca la BD)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Subida de archivos sin límite
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-swallow-size=-1

# Purga de datos de operación que ya no se usan (registros dados de baja, lotes/segmentaciones reemplazados,
# rutas y vuelos sin uso, eventos vencidos). Cron de Spring en UTC; "-" la desactiva. También: POST /api/operation-purge
morapack.purga.cron=${PURGA_CRON:0 17 * * * *}
