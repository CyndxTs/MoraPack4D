# === PRODUCCIÓN: TiDB Cloud (Render; también sirve para el seed desde tu PC) ===
# Credenciales en server/.env o en las variables de Render (variables TIDB_*). El usuario lleva prefijo: "xxxxxxxx.root".
# TiDB solo acepta TLS; Java ya confía en su certificado (no hace falta descargar el CA).
spring.datasource.url=jdbc:mysql://${TIDB_DB_HOST}:${TIDB_DB_PORT:4000}/${TIDB_DB_NAME:morapack4d}?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&connectionTimeZone=UTC
spring.datasource.username=${TIDB_DB_USER}
spring.datasource.password=${TIDB_DB_PASSWORD}

# El plan gratuito de TiDB limita conexiones y el de Render tiene poca RAM: pool pequeño
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# TiDB cierra conexiones inactivas; se reciclan antes
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000